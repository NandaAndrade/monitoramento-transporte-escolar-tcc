[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presenca"
version = "0.1.0"
description = "Software embarcado de monitoramento de presenca em transporte escolar rural"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dependencias dos adaptadores; o dominio e os casos de uso nao precisam delas.
# 4.10.0.84: a 5.0.0 nao traz os arquivos de cascata Haar e quebra o detector "opencv".
camera = ["opencv-python==4.10.0.84"]
deepface = ["deepface", "tf-keras", "numpy"]
mqtt = ["paho-mqtt>=2.0"]
# Scripts de benchmark e preparacao de dataset (pasta pesquisa/).
pesquisa = [
    "deepface",
    "tf-keras",
    "opencv-python==4.10.0.84",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "pillow",
    # Detector usado na comparacao OpenCV x RetinaFace (pesquisa/comparar_detectores.py).
    "retina-face",
]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "pesquisa", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
# So codigo Python; os .md sao documentos e nao devem ser reformatados.
include = ["*.py", "*.pyi"]
extend-exclude = ["pesquisa/dados", "monografia"]
# Pastas com modulos do projeto (para o isort separar dos pacotes externos).
src = ["src", "pesquisa", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
